<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Flappy Vanik</title>
<meta name="description" content="Flappy Vanik — помоги Ванику пролететь между трубами! Бесплатная игра прямо в браузере.">
<meta name="theme-color" content="#2F9BEF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flappy Vanik">
<meta property="og:title" content="Flappy Vanik">
<meta property="og:description" content="Помоги Ванику пролететь между трубами!">
<meta property="og:image" content="og.jpg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #14213D;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  #game { position: fixed; display: block; touch-action: none; }
  #safe {
    position: fixed; top: 0; left: 0; width: 0; visibility: hidden; pointer-events: none;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #fff; font: 700 16px system-ui, sans-serif; background: #2F9BEF;
  }
  /* ---------- Таблица рекордов ---------- */
  .lb {
    position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    background: rgba(20, 33, 61, 0.55); touch-action: auto;
    font-family: "Press Start 2P", "Arial Black", system-ui, sans-serif; color: #14213D;
    -webkit-user-select: text; user-select: text;
  }
  .lb[hidden] { display: none; }
  .lb-card {
    position: relative; box-sizing: border-box; width: min(340px, 100%); max-height: 100%; overflow: auto;
    background: #FFF1C1; border: 5px solid #14213D; border-radius: 14px;
    box-shadow: inset 0 0 0 4px #FFF1C1, inset 0 0 0 7px #E3C774, 0 6px 0 rgba(20, 33, 61, 0.35);
    padding: 22px 18px 18px;
  }
  .lb h2 { margin: 0 0 16px; font-size: 15px; line-height: 1.4; text-align: center; color: #F07E2A; }
  .lb-x {
    position: absolute; top: 8px; right: 8px; width: 34px; height: 34px; border: 0; border-radius: 8px;
    background: transparent; color: #14213D; font: 700 18px system-ui, sans-serif; cursor: pointer;
  }
  .lb ol { list-style: none; margin: 0; padding: 0; font-size: 10px; line-height: 1; }
  .lb li {
    display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 8px;
    padding: 8px 6px; border-radius: 6px;
  }
  .lb li:nth-child(odd) { background: rgba(227, 199, 116, 0.35); }
  .lb li.me { background: #FFD23F; }
  .lb li .r { color: #F07E2A; }
  .lb li .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-status { margin: 10px 0 0; min-height: 12px; font-size: 9px; line-height: 1.5; text-align: center; color: #6B5B2E; }
  .lb form { margin-top: 14px; padding-top: 14px; border-top: 3px dashed #E3C774; }
  .lb label { display: block; margin-bottom: 8px; font-size: 9px; color: #6B5B2E; }
  .lb-row { display: flex; gap: 8px; }
  .lb input {
    flex: 1; min-width: 0; box-sizing: border-box; height: 40px; padding: 0 10px;
    border: 3px solid #14213D; border-radius: 8px; background: #fff; color: #14213D;
    font: 12px "Press Start 2P", system-ui, sans-serif;
  }
  .lb button[type="submit"] {
    height: 40px; padding: 0 14px; border: 3px solid #14213D; border-radius: 8px; cursor: pointer;
    background: #6CC64A; color: #fff; font: 11px "Press Start 2P", system-ui, sans-serif;
    text-shadow: 0 2px 0 #14213D;
  }
  .lb button:disabled { opacity: 0.6; cursor: default; }
  .lb-me { margin: 10px 0 0; font-size: 9px; line-height: 1.6; color: #6B5B2E; }
  /* ---------- Громкость ---------- */
  .vol-card { width: min(300px, 100%); }
  .vol-row { display: flex; justify-content: space-between; align-items: center; margin: 18px 0 10px; font-size: 11px; }
  .vol-row output { color: #F07E2A; min-width: 3ch; text-align: right; }
  .lb input[type="range"] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 18px; margin: 0; padding: 0;
    border: 3px solid #14213D; border-radius: 9px; box-sizing: border-box; cursor: pointer;
    background: linear-gradient(#FFD23F, #FFD23F) 0 0 / var(--p, 50%) 100% no-repeat, #fff;
  }
  .lb input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 28px; height: 28px;
    background: #6CC64A; border: 3px solid #14213D; border-radius: 7px; box-shadow: 0 3px 0 rgba(20, 33, 61, 0.35);
  }
  .lb input[type="range"]::-moz-range-thumb {
    width: 22px; height: 22px; background: #6CC64A; border: 3px solid #14213D; border-radius: 7px;
  }
  .lb input[type="range"]:focus-visible { outline: 3px solid #4EA8DE; outline-offset: 3px; }
  .vol-hint { margin: 16px 0 0; font-size: 8px; line-height: 1.6; color: #6B5B2E; text-align: center; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="safe"></div>
<div id="loading">Загрузка…</div>
<div id="lb" class="lb" hidden>
  <div class="lb-card" role="dialog" aria-modal="true" aria-labelledby="lb-title">
    <button class="lb-x" id="lb-close" type="button" aria-label="Закрыть">✕</button>
    <h2 id="lb-title">🏆 ТОП ИГРОКОВ</h2>
    <ol id="lb-list"></ol>
    <p class="lb-status" id="lb-status"></p>
    <form id="lb-form" autocomplete="off">
      <label for="lb-name">ТВОЁ ИМЯ В ТАБЛИЦЕ</label>
      <div class="lb-row">
        <input id="lb-name" maxlength="12" placeholder="Ваник" enterkeyhint="done" spellcheck="false">
        <button type="submit" id="lb-save">ОК</button>
      </div>
      <p class="lb-me" id="lb-me"></p>
    </form>
  </div>
</div>
<div id="vol" class="lb" hidden>
  <div class="lb-card vol-card" role="dialog" aria-modal="true" aria-labelledby="vol-title">
    <button class="lb-x" id="vol-close" type="button" aria-label="Закрыть">✕</button>
    <h2 id="vol-title">ГРОМКОСТЬ</h2>
    <div class="vol-row"><label for="vol-music">🎵 МУЗЫКА</label><output id="vol-music-v" for="vol-music">60</output></div>
    <input type="range" id="vol-music" min="0" max="100" step="1" value="60">
    <div class="vol-row"><label for="vol-sfx">🔔 ЗВУКИ</label><output id="vol-sfx-v" for="vol-sfx">85</output></div>
    <input type="range" id="vol-sfx" min="0" max="100" step="1" value="85">
    <p class="vol-hint">НА КОМПЬЮТЕРЕ: M — ВЫКЛ/ВКЛ ЗВУК</p>
  </div>
</div>
<script>
"use strict";
(() => {
  // ---------- Настройки (единицы дизайна, умножаются на u) ----------
  const VERSION = "1.7";
  const CFG = {
    gravity: 1750, flap: 540, maxFall: 900, speed: 175,
    pipeWidth: 70, pipeSpacing: 235, baseGap: 178, minGap: 148,
    birdHeight: 70, hitRadius: 22,
    regionFrom: 6,    // до этого счёта — Зелёная долина, дальше случайные города
    regionEvery: 10,  // смена города каждые N труб
    themeEvery: 20,   // смена времени суток каждые N очков
  };
  // Онлайн-таблица рекордов (Firebase Realtime Database, REST)
  const LB_DB = "https://flappy-vanik-default-rtdb.europe-west1.firebasedatabase.app";
  const FINE_POINTER = !!(window.matchMedia && matchMedia("(hover: hover) and (pointer: fine)").matches);
  const OUTLINE = "#14213D";
  const FONT = '"Press Start 2P", "Arial Black", "Avenir Next", system-ui, sans-serif';
  const PIXEL_FONT_SCALE = 0.62; // Press Start 2P очень широкий

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d", { alpha: false });   // непрозрачный холст — быстрее композитинг
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  // ---------- Картинки ----------
  const img = (src) => new Promise((res) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });

  // ---------- Звук (синтез через WebAudio) ----------
  // громкость 0..1; старый флаг «muted» из v1.1 превращаем в нулевую громкость
  const readVol = (k, d) => { const v = parseFloat(store.get(k, "")); return isFinite(v) ? Math.min(1, Math.max(0, v)) : d; };
  const wasMuted = store.get("muted", "0") === "1";
  const Audio = {
    ctx: null, buffers: {}, unlocked: false,
    vol: { music: readVol("volMusic", wasMuted ? 0 : 0.6), sfx: readVol("volSfx", wasMuted ? 0 : 0.85) },
    unlock() {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
        // микшер: эффекты и музыка → компрессор → колонки
        this.master = this.ctx.createDynamicsCompressor();
        this.master.threshold.value = -10; this.master.ratio.value = 4;
        this.master.connect(this.ctx.destination);
        this.sfxGain = this.ctx.createGain(); this.sfxGain.connect(this.master);
        this.musicGain = this.ctx.createGain(); this.musicGain.connect(this.master);
        this.musicBus = this.ctx.createGain(); this.musicBus.connect(this.musicGain);   // «приглушение» в меню/паузе
        this.applyVolume();
        this.build();
        Music.init();
      }
      this.unlocked = true;
      if (this.ctx.state === "suspended" && !document.hidden) this.ctx.resume();
      Music.start();
    },
    setVolume(kind, v) {
      this.vol[kind] = Math.min(1, Math.max(0, v));
      store.set(kind === "music" ? "volMusic" : "volSfx", this.vol[kind].toFixed(2));
      this.applyVolume();
    },
    applyVolume() {
      if (!this.ctx) return;
      const t = this.ctx.currentTime;
      this.sfxGain.gain.setTargetAtTime(this.vol.sfx * this.vol.sfx, t, 0.02);          // квадрат — ближе к слуху
      this.musicGain.gain.setTargetAtTime(this.vol.music * this.vol.music * 1.1, t, 0.02);
    },
    get level() { return Math.max(this.vol.music, this.vol.sfx); },
    build() {
      const sr = this.ctx.sampleRate;
      const make = (dur, fn) => {
        const n = Math.floor(sr * dur), b = this.ctx.createBuffer(1, n, sr), d = b.getChannelData(0);
        fn(d, n, sr);
        return b;
      };
      let seed = 1; const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647 * 2 - 1; };
      const env = (i, n, a, r) => Math.min(1, i / (sr * a)) * Math.exp(-i / n * r);
      this.buffers.flap = make(0.12, (d, n) => {
        let ph = 0, lp = 0;
        for (let i = 0; i < n; i++) {
          ph += 2 * Math.PI * (500 + 400 * i / n) / sr; lp += 0.15 * (rnd() - lp);
          d[i] = (0.25 * Math.sin(ph) + 1.6 * lp) * env(i, n, 0.01, 6) * 0.7;
        }
      });
      const tone = (d, start, len, f, r) => {
        for (let i = 0; i < len; i++) {
          const s = Math.sin(2 * Math.PI * f * i / sr);
          d[start + i] = (Math.sign(s) * 0.25 + s * 0.4) * env(i, len, 0.002, r) * 0.8;
        }
      };
      this.buffers.point = make(0.33, (d) => { tone(d, 0, Math.floor(sr * 0.08), 988, 1); tone(d, Math.floor(sr * 0.08), Math.floor(sr * 0.25), 1319, 5); });
      this.buffers.hit = make(0.2, (d, n) => {
        let ph = 0;
        for (let i = 0; i < n; i++) { ph += 2 * Math.PI * (160 - 110 * i / n) / sr; d[i] = (Math.sin(ph) + rnd() * 0.6) * env(i, n, 0.001, 9) * 0.8; }
      });
      this.buffers.die = make(0.5, (d, n) => {
        let ph = 0;
        for (let i = 0; i < n; i++) { ph += 2 * Math.PI * (700 - 550 * i / n) / sr; const s = Math.sin(ph); d[i] = (Math.sign(s) * 0.2 + s * 0.35) * env(i, n, 0.01, 3); }
      });
      this.buffers.swoosh = make(0.35, (d, n) => {
        let y = 0;
        for (let i = 0; i < n; i++) { y += (0.02 + 0.23 * i / n) * (rnd() - y); d[i] = y * 2.2 * Math.sin(Math.PI * i / n); }
      });
    },
    play(name) {
      if (this.vol.sfx <= 0 || !this.ctx || !this.buffers[name]) return;
      const s = this.ctx.createBufferSource();
      s.buffer = this.buffers[name];
      s.connect(this.sfxGain);
      s.start();
    },
  };

  // ---------- Фоновая музыка: стартовая тема + своя песня у каждого города (чиптюн на WebAudio), 8 тактов ----------
  // мелодия: [позиция в такте (16-е), MIDI-нота, длина в 16-х]; аккорд: [бас, [4 ноты]]
  const CH = {
    Am: [45, [57, 60, 64, 69]], Dm: [38, [57, 62, 65, 69]], E: [40, [56, 59, 64, 68]], Gm: [43, [58, 62, 67, 70]],
    A: [45, [57, 61, 64, 69]], C: [48, [55, 60, 64, 67]], F: [41, [53, 57, 60, 65]], G: [43, [55, 59, 62, 67]], Bb: [46, [58, 62, 65, 70]],
    // джазовые септаккорды
    Em7b5: [40, [52, 55, 58, 62]], A7: [45, [55, 57, 61, 64]], Dm7: [38, [57, 60, 62, 65]], Gm7: [43, [58, 62, 65, 67]], C7: [36, [55, 58, 60, 64]], Fmaj7: [41, [57, 60, 64, 65]],
  };
  // духовые и язычковые: волна, фильтр, громкость, вибрато (в центах), подъезд к ноте снизу
  const WINDS = {
    sax: { waves: ["sawtooth"], cut: 2200, v: 0.075, vib: 12, bend: 0.94, att: 0.04 },
    zurna: { waves: ["square", "sawtooth"], cut: 3800, v: 0.05, vib: 8, bend: 0.97, att: 0.02 },
    flute: { waves: ["triangle", "sine"], cut: 5000, v: 0.11, vib: 10, bend: 0.99, att: 0.05 },
    accordion: { waves: ["square", "sawtooth"], cut: 2600, v: 0.04, vib: 4, bend: 1, att: 0.03 },
  };
  const THEMES = [
    { // Старт (Зелёная долина): Am – F – C – G
      bpm: 140, voice: "chip", bass: "pop", arp: true, drum: "pop", chords: [CH.Am, CH.F, CH.C, CH.G],
      lead: [
        [[0, 76, 2], [2, 81, 2], [4, 79, 1], [5, 76, 1], [6, 74, 2], [8, 76, 4], [12, 72, 2], [14, 74, 2]],
        [[0, 72, 2], [2, 77, 2], [4, 76, 1], [5, 72, 1], [6, 69, 2], [8, 72, 4], [12, 69, 2], [14, 72, 2]],
        [[0, 67, 2], [2, 72, 2], [4, 76, 2], [6, 79, 2], [8, 76, 2], [10, 72, 2], [12, 74, 2], [14, 76, 2]],
        [[0, 74, 2], [2, 71, 2], [4, 67, 2], [6, 71, 2], [8, 74, 6]],
        [[0, 81, 3], [3, 79, 1], [4, 76, 2], [6, 79, 2], [8, 81, 2], [10, 84, 2], [12, 83, 2], [14, 79, 2]],
        [[0, 81, 3], [3, 79, 1], [4, 77, 2], [6, 76, 2], [8, 77, 2], [10, 81, 2], [12, 79, 2], [14, 77, 2]],
        [[0, 76, 2], [2, 79, 2], [4, 84, 4], [8, 83, 2], [10, 79, 2], [12, 76, 2], [14, 79, 2]],
        [[0, 83, 2], [2, 81, 2], [4, 79, 2], [6, 74, 2], [8, 79, 4], [12, 71, 2], [14, 74, 2]],
      ],
    },
    { // Москва: русский этно-поп — свирель, синт-арпеджио, бочка «в пол»
      bpm: 128, gain: 0.66, voice: "flute", bass: "pop", arp: true, drum: "edm", chords: [CH.Dm, CH.Bb, CH.C, CH.Dm, CH.Dm, CH.Bb, CH.C, CH.A],
      lead: [
        [[0, 74, 3], [3, 72, 1], [4, 74, 2], [6, 77, 2], [8, 76, 2], [10, 74, 2], [12, 72, 2], [14, 69, 2]],
        [[0, 70, 3], [3, 72, 1], [4, 74, 2], [6, 72, 2], [8, 70, 4], [12, 69, 2], [14, 70, 2]],
        [[0, 72, 3], [3, 74, 1], [4, 76, 2], [6, 79, 2], [8, 77, 2], [10, 76, 2], [12, 74, 2], [14, 72, 2]],
        [[0, 74, 6], [6, 69, 2], [8, 74, 8]],
        [[0, 81, 2], [2, 81, 2], [4, 79, 2], [6, 77, 2], [8, 79, 2], [10, 77, 2], [12, 76, 2], [14, 74, 2]],
        [[0, 77, 2], [2, 77, 2], [4, 76, 2], [6, 74, 2], [8, 74, 4], [12, 70, 2], [14, 74, 2]],
        [[0, 76, 2], [2, 79, 2], [4, 77, 2], [6, 76, 2], [8, 74, 2], [10, 72, 2], [12, 74, 2], [14, 76, 2]],
        [[0, 73, 4], [4, 76, 4], [8, 81, 8]],
      ],
    },
    { // Санторини: греческий танец с разгоном — бузуки, с каждым кругом быстрее
      bpm: 96, accel: 18, bpmMax: 168, voice: "trem", bass: "fifth", arp: true, drum: "light",
      chords: [CH.Dm, CH.Dm, CH.A, CH.A, CH.Gm, CH.Dm, CH.A, CH.Dm],
      lead: [
        [[0, 69, 4], [4, 74, 2], [6, 74, 2], [8, 74, 2], [10, 76, 2], [12, 77, 4]],
        [[0, 76, 2], [2, 74, 2], [4, 76, 2], [6, 77, 2], [8, 74, 8]],
        [[0, 73, 2], [2, 74, 2], [4, 76, 2], [6, 77, 2], [8, 79, 2], [10, 77, 2], [12, 76, 4]],
        [[0, 76, 2], [2, 77, 1], [3, 76, 1], [4, 73, 2], [6, 69, 2], [8, 69, 8]],
        [[0, 79, 4], [4, 82, 2], [6, 81, 2], [8, 79, 2], [10, 77, 2], [12, 79, 4]],
        [[0, 77, 2], [2, 76, 2], [4, 74, 2], [6, 77, 2], [8, 81, 4], [12, 77, 4]],
        [[0, 76, 2], [2, 74, 2], [4, 73, 2], [6, 74, 2], [8, 76, 2], [10, 79, 2], [12, 77, 2], [14, 76, 2]],
        [[0, 74, 4], [4, 69, 4], [8, 74, 8]],
      ],
    },
    { // Ереван: плясовая в духе Шалахо — зурна, дам, дхол, размер 6/8
      bpm: 200, len: 12, gain: 0.74, voice: "zurna", bass: "drone", tonic: 45, arp: false, drum: "dhol68", chords: [CH.A],
      lead: [
        [[0, 76, 2], [2, 77, 1], [3, 76, 1], [4, 74, 2], [6, 73, 2], [8, 74, 2], [10, 76, 2]],
        [[0, 77, 2], [2, 76, 2], [4, 74, 2], [6, 73, 4], [10, 70, 2]],
        [[0, 69, 2], [2, 70, 2], [4, 73, 2], [6, 74, 2], [8, 76, 2], [10, 77, 2]],
        [[0, 76, 4], [4, 74, 2], [6, 76, 6]],
        [[0, 81, 2], [2, 79, 2], [4, 77, 2], [6, 79, 2], [8, 77, 2], [10, 76, 2]],
        [[0, 77, 2], [2, 76, 2], [4, 74, 2], [6, 76, 2], [8, 74, 2], [10, 73, 2]],
        [[0, 74, 2], [2, 73, 2], [4, 70, 2], [6, 73, 2], [8, 74, 2], [10, 73, 2]],
        [[0, 69, 6], [6, 69, 2], [8, 73, 2], [10, 76, 2]],
      ],
    },
    { // Баку: бакинский джаз — свинг, саксофон с мугамными оборотами, шагающий бас, щётки
      bpm: 120, swing: 0.33, gain: 1.2, voice: "sax", bass: "walk", arp: false, comp: true, drum: "jazz",
      chords: [CH.Em7b5, CH.A7, CH.Dm7, CH.Dm7, CH.Gm7, CH.C7, CH.Fmaj7, CH.A7],
      lead: [
        [[0, 74, 3], [3, 76, 1], [4, 77, 2], [6, 76, 2], [8, 74, 2], [10, 70, 2], [12, 72, 4]],
        [[0, 73, 2], [2, 74, 1], [3, 73, 1], [4, 70, 2], [6, 69, 2], [8, 73, 4], [12, 76, 4]],
        [[0, 77, 6], [6, 76, 2], [8, 74, 2], [10, 72, 2], [12, 74, 4]],

    const house = (x, w) => {
      const h = 11 + Math.floor(rnd() * 9), y0 = bank - h, bal = BAL[Math.floor(rnd() * BAL.length)];
      R(WALL[Math.floor(rnd() * WALL.length)], x, y0, w, h); R("#00000022", x + w - 1, y0, 1, h);
      R(ROOF, x - 1, y0 - 1, w + 2, 1); R(ROOF, x, y0 - 2, w, 1); R("#A84E3C", x + 1, y0 - 3, w - 2, 1);
      for (let xx = x + 1; xx < x + w - 1; xx += 2) { R("#4A3A33", xx, y0 + 2, 1, 2); R("#4A3A33", xx, bank - 4, 1, 3); }
      const by = y0 + 5;
      R(bal, x, by, w, 4); R("#F1E6D2", x, by, w, 1);
      for (let xx = x + 1; xx < x + w; xx += 2) R("#F1E6D2", xx, by + 2);
      R(bal, x, by + 4, 1, 3); R(bal, x + w - 1, by + 4, 1, 3);
    };
    const row = (x0, x1) => { for (let x = x0; x < x1 - 4;) { const w = Math.min(x1 - x, 6 + Math.floor(rnd() * 5)); house(x, w); x += w + 1; } };
    // Мост Мира
    const bx = Math.round(cw * 0.36), span = 24;
    row(1, bx - 1);
    R("#7D8B96", bx, bank - 2, span, 1); R("#B9C6CF", bx, bank - 1, span, 1);
    for (let i = 0; i <= span; i++) {
      const y = bank - 4 - Math.round(3 * Math.abs(Math.sin(i / span * Math.PI * 2)));
      R("#63BFC666", bx + i, y, 1, bank - 2 - y); R("#E6F7F8", bx + i, y);
    }
    // серные бани Абанотубани
    const ab = Math.round(cw * 0.78);
    row(bx + span + 2, ab - 9);
    for (const dx of [-5, 3]) {
      const cx = ab + dx;
      R("#B5653F", cx - 4, bank - 3, 9, 3);
      [4, 4, 3, 2, 1].forEach((k, i) => R(i & 1 ? "#C97650" : "#B5653F", cx - k, bank - 4 - i, 2 * k + 1, 1));
      R("#7A3E25", cx, bank - 10, 1, 2);
    }
    row(ab + 9, cw);
  }

  function buildRegions(b) {
    const cw = Math.round(tileW / b);
    const L = (hc, paint) => cellLayer(cw, hc, b, paint);
    tex.regions = [
      { far: null, near: tex.hills },
      { far: L(66, paintMoscowFar), near: L(48, paintMoscowNear) },
      { far: L(34, paintSantoriniFar), near: L(44, paintSantoriniNear) },
      { far: L(70, paintYerevanFar), near: L(46, paintYerevanNear) },
      { far: L(64, paintBakuFar), near: L(44, paintBakuNear) },
      { far: L(62, paintTbilisiFar), near: L(46, paintTbilisiNear) },
    ];
  }

  // ---------- Колонны городов: та же форма, что у трубы (оголовок + ствол), своя отделка ----------
  const PIPE_SKIN = ["green", "kremlin", "santorini", "cascade", "carpet", "food"];
  function pipeSkin(pw, capH, b, paint) {
    const cw = Math.round(pw / b), ch = Math.ceil(H / b) + 1, cr = Math.round(capH / b);
    return offscreen(pw, H, (g) => {
      const R = (c, x, y, w = 1, h = 1) => { if (w > 0 && h > 0) { g.fillStyle = c; g.fillRect(x * b, y * b, w * b + 0.5, h * b + 0.5); } };
      paint(R, cw, ch, cr);
    });
  }
  const pipeSides = (R, cw, y0, h) => { R(OUTLINE, 1, y0, 1, h); R(OUTLINE, cw - 2, y0, 1, h); };

  // Москва: кремлёвский кирпич, зубцы «ласточкин хвост», белокаменный пояс
  function paintKremlinPipe(R, cw, ch, cr) {
    const BR = "#B8352E", BRD = "#8E2A22", BRL = "#D25443", MOR = "#E3B9A0", WH = "#F4EFE6";
    R(BR, 2, cr, cw - 4, ch - cr);
    for (let y = cr; y < ch; y += 3) {
      R(MOR, 2, y, cw - 4, 1);
      for (let x = 2 + (Math.floor((y - cr) / 3) & 1 ? 2 : 0); x < cw - 2; x += 4) R(MOR, x, y + 1, 1, 2);
    }
    R(BRL, 2, cr, 1, ch - cr); R(BRD, cw - 3, cr, 1, ch - cr);
    pipeSides(R, cw, cr, ch - cr);
    const n = Math.floor((cw + 1) / 4), x0 = Math.floor((cw - (n * 4 - 1)) / 2);
    for (let k = 0; k < n; k++) {
      const x = x0 + k * 4;
      R(BR, x, 1, 3, 3); R(BR, x, 0); R(BR, x + 2, 0); R(BRL, x, 0, 1, 4); R(BRD, x + 2, 0, 1, 4);
    }
    R(OUTLINE, 0, 4, cw, 1); R(WH, 0, 5, cw, 1); R(OUTLINE, 0, cr - 1, cw, 1);
    R(OUTLINE, 0, 4, 1, cr - 4); R(OUTLINE, cw - 1, 4, 1, cr - 4);
  }

  // Санторини: дорическая колонна (белый мрамор Акрополя или синяя)
  function paintColumnPipe(R, cw, ch, cr, P) {
    for (let i = 2; i < cw - 2; i++) {
      const f = (i - 2) / (cw - 5);
      let c = f < 0.18 ? P.light : f > 0.72 ? P.shade : P.base;
      if ((i - 2) % 3 === 2) c = f > 0.72 ? P.dark : P.flute; // каннелюры
      R(c, i, cr, 1, ch - cr);
    }
    for (let y = cr + 12; y < ch; y += 16) R(P.dark, 2, y, cw - 4, 1); // стыки барабанов
    pipeSides(R, cw, cr, ch - cr);
    // капитель: абака, эхин, шейка
    R(OUTLINE, 0, 0, cw, 1); R(P.capL, 1, 1, cw - 2, 1); R(P.cap, 1, 2, cw - 2, 1); R(OUTLINE, 0, 3, cw, 1);
    R(OUTLINE, 0, 0, 1, 5); R(OUTLINE, cw - 1, 0, 1, 5);
    R(P.cap, 1, 4, cw - 2, 1); R(P.capS, cw - 4, 4, 3, 1);
    R(OUTLINE, 1, 5, 1, 1); R(OUTLINE, cw - 2, 5, 1, 1); R(P.cap, 2, 5, cw - 4, 1); R(P.capS, cw - 5, 5, 3, 1);
    R(OUTLINE, 1, cr - 1, cw - 2, 1);
  }
  const MARBLE = { base: "#F2EEE6", light: "#FFFFFF", shade: "#D9D1C3", flute: "#D6CDBE", dark: "#BDB3A2", cap: "#EDE7DC", capL: "#FFFFFF", capS: "#CFC6B6" };
  const AEGEAN = { base: "#2F6FD0", light: "#5B95E8", shade: "#2155A8", flute: "#2860BC", dark: "#173F80", cap: "#FFFFFF", capL: "#FFFFFF", capS: "#D9E4EE" };

  // Баку: ковёр — красное поле, синяя кайма, медальоны-гёли, бахрома на торце
  function paintCarpetPipe(R, cw, ch, cr) {
    const RED = "#A3242B", RD = "#7E1A21", NAVY = "#1F2A5A", GOLD = "#E2B23C", IV = "#EADFC8";
    R(RED, 2, cr, cw - 4, ch - cr);
    for (const x of [2, cw - 4]) R(NAVY, x, cr, 2, ch - cr);
    R(IV, 4, cr, 1, ch - cr); R(IV, cw - 5, cr, 1, ch - cr);
    for (let y = cr + 1; y < ch; y += 3) { R(GOLD, 2 + ((y >> 1) & 1), y); R(GOLD, cw - 4 + ((y >> 1) & 1), y); }
    const c = Math.floor(cw / 2);
    for (let yc = cr + 8; yc < ch + 6; yc += 14) {
      for (let dy = -5; dy <= 5; dy++) { const k = 5 - Math.abs(dy); R(NAVY, c - k, yc + dy, 2 * k + 1, 1); }
      for (let dy = -3; dy <= 3; dy++) { const k = 3 - Math.abs(dy); R(IV, c - k, yc + dy, 2 * k + 1, 1); }
      R(RED, c, yc - 1, 1, 3); R(RED, c - 1, yc, 3, 1); R(GOLD, c, yc);
      R(GOLD, c - 1, yc + 7, 3, 1); R(GOLD, c, yc + 6, 1, 3);
    }
    pipeSides(R, cw, cr, ch - cr);
    for (let x = 1; x < cw - 1; x += 2) R(IV, x, 0, 1, 3);
    R(OUTLINE, 0, 3, cw, 1); R(NAVY, 0, 4, cw, 1); for (let x = 1; x < cw - 1; x += 2) R(GOLD, x, 4);
    R(RD, 0, 5, cw, 1); R(OUTLINE, 0, cr - 1, cw, 1);
    R(OUTLINE, 0, 3, 1, cr - 3); R(OUTLINE, cw - 1, 3, 1, cr - 3);
  }

  // Тбилиси: хинкали и хачапури на шампуре, сверху — аджарское хачапури с желтком
  function paintFoodPipe(R, cw, ch, cr) {
    const c = Math.floor(cw / 2), DO = "#F1E3C8", DS = "#D9C19A", DE = "#8A6A44", CR = "#D98A3D", CRD = "#A85F24", CH = "#F6D35B", YO = "#F39A1E", YL = "#FFD27A";
    R("#7A5236", c - 1, cr, 3, ch - cr); R("#5E3E26", c + 1, cr, 1, ch - cr);
    const khinkali = (y) => {
      const rows = [3, 5, 7, 11, 15, 17, 19, 19, 19, 17, 13];
      rows.forEach((w0, i) => {
        const w = Math.min(w0, cw - 2), x = c - (w >> 1);
        R(i > 8 ? DS : DO, x, y + i, w, 1); R(DS, x + w - 3, y + i, 3, 1); R(DE, x, y + i); R(DE, x + w - 1, y + i);
        if (i > 1 && i < 8) for (const j of [-3, -2, -1, 1, 2, 3]) R("#C4A77A", c + Math.round(j * (w - 1) / 8), y + i); // складки к хвостику
      });
      R(DE, c - 1, y - 2, 3, 2); R(DO, c, y - 2); // хвостик
      R(DE, c - 6, y + rows.length, 13, 1);
    };
    const khachapuri = (y) => {
      [9, 15, 19, 19, 19, 19, 15, 9].forEach((w0, i) => { const w = Math.min(w0, cw - 2), x = c - (w >> 1); R(CR, x, y + i, w, 1); R(CRD, x, y + i); R(CRD, x + w - 1, y + i); });
      R(CRD, c - 4, y + 8, 9, 1);
      [5, 9, 11, 11, 9, 5].forEach((w, i) => R(CH, c - (w >> 1), y + 1 + i, w, 1));
      R(YO, c - 1, y + 2, 3, 3); R(YL, c - 1, y + 2); R("#FFFFFF", c + 2, y + 3);
    };
    for (let y = cr + 2, k = 0; y < ch; y += (k & 1 ? 11 : 15), k++) (k & 1 ? khachapuri : khinkali)(y);
    [13, 19, 21, 21, 19, 13].forEach((w0, i) => { const w = Math.min(w0, cw), x = c - (w >> 1); R(CR, x, i, w, 1); R(CRD, x, i); R(CRD, x + w - 1, i); });
    [7, 13, 13, 7].forEach((w, i) => R(CH, c - (w >> 1), 1 + i, w, 1));
    R(YO, c - 1, 1, 3, 3); R(YL, c - 1, 1); R("#FFF6D8", c - 4, 2, 2, 1);
    R(OUTLINE, 1, cr - 1, cw - 2, 1);
  }

  // Ереван: Каскад — травертиновые террасы с садами, арками, лестницей и фонтанами
  function paintCascadePipe(R, cw, ch, cr) {
    const TR = "#EFE4CE", TS = "#D5C4A2", TL = "#FAF3E3", GR = "#5CA64E", GD = "#3F8A3A", ARC = "#A88F6A", WA = "#7CC4F0", TUFF = "#D89A88";
    const c = Math.floor(cw / 2);
    R(TR, 2, cr, cw - 4, ch - cr); R(TL, 2, cr, 1, ch - cr); R(TS, cw - 3, cr, 1, ch - cr);
    for (let y = cr + 2; y < ch; y += 10) {
      R(GR, 2, y, cw - 4, 1); for (let x = 3; x < cw - 3; x += 3) R(GD, x, y - 1);
      R(TS, 2, y + 1, cw - 4, 1);
      for (const x of [3, cw - 6]) { R(ARC, x, y + 4, 3, 4); R(ARC, x + 1, y + 3); }
      for (let k = 0; k < 8; k++) R(k & 1 ? TS : TL, c - 2, y + 2 + k, 5, 1);
      R(WA, c - 1, y + 8, 3, 1);
    }
    pipeSides(R, cw, cr, ch - cr);
    R(OUTLINE, 0, 0, cw, 1); R(GR, 1, 1, cw - 2, 1); for (let x = 2; x < cw - 2; x += 3) R(GD, x, 1);
    R(TUFF, 1, 2, cw - 2, 1); R(TL, 1, 3, cw - 2, 2); R(WA, c - 2, 4, 5, 1); R(TS, 1, 5, cw - 2, 1); R(OUTLINE, 0, cr - 1, cw, 1);
    R(OUTLINE, 0, 0, 1, cr); R(OUTLINE, cw - 1, 0, 1, cr);
  }

  function buildPipeSkins(pw, capH, b) {
    const S = (paint) => pipeSkin(pw, capH, b, paint);
    return {
      kremlin: S(paintKremlinPipe),
      white: S((R, cw, ch, cr) => paintColumnPipe(R, cw, ch, cr, MARBLE)),
      blue: S((R, cw, ch, cr) => paintColumnPipe(R, cw, ch, cr, AEGEAN)),
      carpet: S(paintCarpetPipe),
      food: S(paintFoodPipe),
      cascade: S(paintCascadePipe),
    };
  }

  function buildTextures() {
    const b = block;
    tex.skies = SKIES.map(def => buildSky(def, b));
    tex.sky = tex.skies[0];

    const ch = Math.round(150 * u / b) * b;
    tex.clouds = offscreen(tileW, ch, (g) => {
      rect(g, "#E6F6FE", 0, ch * 0.62, tileW, ch * 0.38 + 1);
      const cw = CLOUD[0].length * b, offs = [0.30, 0.18, 0.36, 0.24, 0.12];
      for (let x = 0, i = 0; x + cw <= tileW; x += cw * 0.7, i++) drawCloud(g, x, ch * offs[i % 5] + ch * 0.2, b);
      rect(g, "#fff", 0, ch * 0.55, tileW, ch * 0.08);
    });

    const hh = Math.round(90 * u / b) * b;
    tex.hills = offscreen(tileW, hh, (g) => {
      const cols = Math.round(tileW / b);
      for (let c = 0; c < cols; c++) {
        const x = c / cols;
        const h = Math.max(0.2, Math.min(0.98, 0.55 + 0.22 * Math.sin(4 * Math.PI * x) + 0.12 * Math.sin(10 * Math.PI * x + 1.3)));
        const hb = Math.round(h * hh / b) * b, top = hh - hb;
        rect(g, "#5CC43B", c * b, top, b + 0.5, hb);
        rect(g, "#2E7D1F", c * b, top, b + 0.5, b);
        rect(g, "#86DE5A", c * b, top + b, b + 0.5, b);
        if (c % 7 === 3) rect(g, "#86DE5A", c * b, top + b * 4, b, b);
      }
    });

    tex.ground = offscreen(tileW, groundTop, (g) => {
      const cols = Math.round(tileW / b), rows = Math.round(groundTop / b) + 1;
      for (let c = 0; c < cols; c++) for (let r = 0; r < rows; r++) {
        let col;
        if (r === 0) col = OUTLINE;
        else if (r <= 3) col = (Math.floor(c / 2) + r) % 2 === 0 ? "#6BD13F" : "#58B532";
        else if (r === 4) col = "#3F8A24";
        else if (r === 5) col = "#5E3A1A";
        else {
          const checker = (Math.floor(c / 2) + Math.floor(r / 2)) % 2 === 0;
          col = (c * 7 + r * 13) % 23 === 0 ? "#B98450" : checker ? "#9B6634" : "#875628";
        }
        rect(g, col, c * b, r * b, b + 0.5, b + 0.5);
      }
    });

    const bodyW = Math.round(CFG.pipeWidth * u / b) * b, over = b, capH = b * 7, pw = bodyW + over * 2;
    tex.pipeBody = bodyW; tex.pipeCapH = capH;
    tex.pipe = offscreen(pw, H, (g) => {
      const column = (i, n) => {
        if (i === 0 || i === n - 1) return OUTLINE;
        const f = i / n;
        return f < 0.14 ? "#4CA235" : f < 0.32 ? "#A8EA6A" : f < 0.68 ? "#6CC64A" : f < 0.86 ? "#4FA837" : "#3E8A2A";
      };
      const bc = Math.round(bodyW / b);
      for (let i = 0; i < bc; i++) rect(g, column(i, bc), over + i * b, capH, b + 0.5, H - capH);
      const cc = Math.round(pw / b);
      for (let i = 0; i < cc; i++) rect(g, column(i, cc), i * b, 0, b + 0.5, capH);
      rect(g, OUTLINE, 0, 0, pw, b);
      rect(g, OUTLINE, 0, capH - b, pw, b);
      rect(g, "#3E8A2A", over, capH, bodyW, b);
    });
    tex.pipes = buildPipeSkins(pw, capH, b);
    buildRegions(b);
  }

  // ---------- Текст с обводкой ----------
  // Текст рисуется один раз в отдельный холст и дальше просто копируется — это сильно дешевле strokeText каждый кадр
  const measureCtx = document.createElement("canvas").getContext("2d");
  function textSprite(str, size, color, outline, stroke) {
    const key = `${str}|${size.toFixed(2)}|${color}|${outline}|${stroke.toFixed(2)}|${fontReady ? 1 : 0}`;
    let s = textCache.get(key);
    if (s) return s;
    const fs = fontReady ? size * PIXEL_FONT_SCALE : size, font = `${fontReady ? "" : "900 "}${fs}px ${FONT}`;
    measureCtx.font = font;
    const tw = measureCtx.measureText(str).width, pad = Math.ceil(stroke * 2 + 2), cy = pad + fs * 0.7;
    s = offscreen(tw + pad * 2, fs * 1.4 + pad * 2 + stroke, (g) => {
      g.font = font; g.textAlign = "center"; g.textBaseline = "middle"; g.lineJoin = "round";
      g.lineWidth = stroke * 2; g.strokeStyle = outline;
      const cx = tw / 2 + pad;
      g.strokeText(str, cx, cy + stroke * 0.8);   // тень
      g.strokeText(str, cx, cy);
      g.fillStyle = color; g.fillText(str, cx, cy);
    });
    s.ax = tw / 2 + pad; s.ay = cy; s.tw = tw;
    if (textCache.size > 300) textCache.clear();
    textCache.set(key, s);
    return s;
  }
  function text(str, x, y, size, color = "#fff", opts = {}) {
    const { align = "center", outline = OUTLINE, stroke = Math.max(2, size * (fontReady ? 0.16 : 0.08)), alpha = 1 } = opts;
    if (alpha <= 0) return;
    const s = textSprite(String(str), size, color, outline, stroke);
    const dx = align === "center" ? x - s.ax : align === "right" ? x - s.ax - s.tw / 2 : x - s.ax + s.tw / 2;
    const a0 = ctx.globalAlpha;
    ctx.globalAlpha = a0 * alpha;
    ctx.drawImage(s, dx, y - s.ay, s.w, s.h);
    ctx.globalAlpha = a0;
  }
  let fontReady = false;

  function roundRect(x, y, w, h, r, fill, strokeColor, lw) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (strokeColor) { ctx.strokeStyle = strokeColor; ctx.lineWidth = lw; ctx.stroke(); }
  }

  const easeOut = (t) => 1 - Math.pow(1 - Math.min(1, Math.max(0, t)), 3);
  const easeBack = (t) => { t = Math.min(1, Math.max(0, t)); const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

  // ---------- Игра ----------
  const MEDALS = [
    { min: 100, name: "ЛЕГЕНДА", color: "#FF6BD6" },
    { min: 70, name: "АЛМАЗ", color: "#8C7CFF" },
    { min: 40, name: "ПЛАТИНА", color: "#A6F0FF" },
    { min: 30, name: "ЗОЛОТО", color: "#FFD23F" },
    { min: 20, name: "СЕРЕБРО", color: "#C9D1D9" },
    { min: 10, name: "БРОНЗА", color: "#D08A3C" },
  ];

  let game = null;
  class Game {
    constructor(images) {
      this.vanik = images.vanik;
      this.title = images.title;
      this.best = parseInt(store.get("bestScore", "0"), 10) || 0;
      this.t = 0;
      this.scroll = { ground: 0, hills: 0, clouds: 0, far: 0 };
      this.buttons = [];
      this.reset();
    }
    get birdX() { return W * 0.3; }
    get birdStartY() { return groundY - (groundY) * 0.48; }
    onResize(k, oldW) {
      // тайлы пересобраны под новую ширину — прокрутка не должна выходить за tileW (иначе справа «дыра»)
      for (const key in this.scroll) this.scroll[key] %= tileW;
      if (this.state === "ready") { this.bird.y = this.birdStartY; return; }
      if (!isFinite(k) || k <= 0 || !oldW || (Math.abs(k - 1) < 1e-6 && oldW === W)) return;   // только сменилась чёткость
      // пересчитываем мир под новый размер экрана, чтобы трубы не «уехали»
      const ox = oldW * 0.3, nx = this.birdX;
      for (const p of this.pipes) { p.x = nx + (p.x - ox) * k; p.gapY *= k; p.baseY *= k; p.gap *= k; if (p.move) p.move.amp *= k; }
      this.bird.y = Math.min(this.bird.y * k, groundY - CFG.hitRadius * u);
      this.bird.vy *= k;
      if (this.nextPipe) this.nextPipe *= k;
      if (this.lastGap !== null) this.lastGap *= k;
      this.particles = [];
      this.pause();
    }

    reset() {
      this.state = "ready";
      this.stateTime = 0;
      this.score = 0;
      this.pipes = [];
      this.lastGap = null; this.lastAmp = 0;
      this.bird = { y: this.birdStartY, vy: 0, rot: 0, squash: 0 };
      this.flash = 0; this.shake = 0;
      this.scorePop = 0;
      this.over = null;
      this.buttons = [];
      this.particles = [];
      this.sky = { from: 0, to: 0, t: 1 };
      // после проигрыша продолжаем в том же городе и с его музыкой (при запуске — Зелёная долина)
      const keep = this.region ? this.region.to : 0;
      this.startRegion = keep;
      this.region = { from: keep, to: keep, t: 1 };
      this.regionBag = []; this.sched = []; this.spawned = 0;
      Music.setTheme(keep);
      this.banner = null;
      this.playT = 0;
      this.resumeIn = 0;
      this.confetti = false;
    }
    setState(s) { this.state = s; this.stateTime = 0; }

    start() {
      this.setState("playing");
      this.nextPipe = 140 * u;
    }
    flap() {
      this.bird.vy = -CFG.flap * u;
      this.bird.squash = 1;
      Audio.play("flap");
      this.burst(this.birdX - 20 * u, this.bird.y + 12 * u, 5, {
        colors: ["#FFFFFF", "#E3F4FF"], vx: [-CFG.speed * 0.9, -CFG.speed * 0.35], vy: [-30, 70],
        size: [4, 8], life: [0.3, 0.5], g: 0,
      });
    }
    pause() {
      if (this.state !== "playing") return;
      this.setState("paused");
      this.resumeIn = 0;
    }
    resume() {
      if (this.state !== "paused" || this.resumeIn > 0) return;
      this.resumeIn = 1.5;   // отсчёт 3-2-1
      Audio.play("swoosh");
    }
    tap(x, y) {
      Audio.unlock();
      const inR = (r) => r && x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
      if (this.state === "ready" || this.state === "over" || this.state === "paused") {
        if (inR(this.muteRect)) { VolUI.open(); return; }
        if (this.state !== "paused" && inR(this.lbRect)) { Audio.play("swoosh"); LBUI.open(); return; }
      }
      switch (this.state) {
        case "ready": this.start(); this.flap(); break;
        case "playing":
          if (inR(this.pauseRect)) { this.pause(); return; }
          this.flap(); break;
        case "paused": this.resume(); break;
        case "over":
          if (this.stateTime < 0.95) return;
          for (const b of this.buttons) {
            if (inR(b)) { b.pressed = 0.15; Audio.play("swoosh"); setTimeout(b.action, 120); return; }
          }
          break;
      }
    }
    key() {
      Audio.unlock();
      if (this.state === "ready") { this.start(); this.flap(); }
      else if (this.state === "playing") this.flap();
      else if (this.state === "paused") this.resume();
      else if (this.state === "over" && this.stateTime >= 0.95) { Audio.play("swoosh"); this.restart(); }
    }
    togglePause() {
      if (this.state === "playing") this.pause();
      else if (this.state === "paused") this.resume();
    }
    restart() {
      if (this.curtain) return;
      this.curtain = { t: 0, swapped: false };
    }

    crash(onGround) {
      if (this.state !== "playing") return;
      Audio.play("hit");
      vibrate(80);
      this.flash = 1; this.shake = 0.22;
      this.bird.squash = 0;
      this.burst(this.birdX, this.bird.y, 14, {
        colors: ["#FFFFFF", "#FFD23F", "#FF9F1C"], speed: [80, 260], size: [4, 8], life: [0.35, 0.7], g: 500,
      });
      if (onGround) this.finish();
      else {
        this.setState("dying");
        this.bird.vy = Math.max(this.bird.vy, 0);
        setTimeout(() => Audio.play("die"), 200);
      }
    }
    finish() {
      this.setState("over");
      const isNew = this.score > this.best;
      if (isNew) { this.best = this.score; store.set("bestScore", String(this.best)); }
      const medal = MEDALS.find(m => this.score >= m.min) || null;
      this.over = { isNew, medal, shownScore: 0 };
      setTimeout(() => Audio.play("swoosh"), 450);
      const games = (parseInt(store.get("gamesPlayed", "0"), 10) || 0) + 1;
      store.set("gamesPlayed", String(games));
      Leaderboard.submitBest(this.best);   // отправит, только если рекорд вырос и есть имя
    }

    // ---------- Частицы ----------
    burst(x, y, n, o) {
      const R = (a) => a[0] + Math.random() * (a[1] - a[0]);
      for (let i = 0; i < n; i++) {
        let vx, vy;
        if (o.speed) { const a = Math.random() * Math.PI * 2, s = R(o.speed); vx = Math.cos(a) * s; vy = Math.sin(a) * s; }
        else { vx = R(o.vx); vy = R(o.vy); }
        const life = R(o.life);
        this.particles.push({
          x, y, vx: vx * u, vy: vy * u, g: (o.g || 0) * u, life, max: life,
          size: R(o.size) * u, color: o.colors[i % o.colors.length], ui: !!o.ui, spin: Math.random() * 6,
        });
      }
      if (this.particles.length > 260) this.particles.splice(0, this.particles.length - 260);
    }
    updateParticles(dt) {
      for (const p of this.particles) {
        p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; p.spin += dt * 8;
      }
      this.particles = this.particles.filter(p => p.life > 0);
    }
    drawParticles(ui) {
      for (const p of this.particles) {
        if (p.ui !== ui) continue;
        const a = Math.min(1, p.life / p.max * 1.6);
        ctx.globalAlpha = a;
        ctx.fillStyle = p.color;
        if (ui) { const w = p.size * (0.35 + 0.65 * Math.abs(Math.sin(p.spin))); ctx.fillRect(p.x - w / 2, p.y - p.size / 2, w, p.size); }
        else ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
      }
      ctx.globalAlpha = 1;
    }

    spawnPipe() {
      const gap = Math.max(CFG.minGap, CFG.baseGap - this.score) * u;
      const margin = 60 * u;
      const lo = safeTop + margin + gap / 2;          // y-вниз: верхняя граница
      const hi = Math.max(lo, groundY - margin - gap / 2);
      let y = lo + Math.random() * (hi - lo);
      // подвижные трубы отключены — все трубы стоят на месте
      let move = null;
      if (move) y = Math.min(Math.max(y, lo + move.amp), hi - move.amp);
      if (this.lastGap !== null) {
        // максимальный перепад между соседними проёмами с учётом движения — чтобы всегда было проходимо
        const j = 210 * u - (move ? move.amp : 0) - (this.lastAmp || 0);
        y = Math.min(Math.max(y, this.lastGap - j), this.lastGap + j);
      }
      this.lastGap = y;
      this.lastAmp = move ? move.amp : 0;
      const p = { x: W + tex.pipe.w, gapY: y, baseY: y, gap, passed: false, move, skin: this.pipeSkin(this.spawned++) };
      if (move) p.gapY = y + Math.sin(move.ph + this.playT * move.w) * move.amp;
      this.pipes.push(p);
    }

    update(dt) {
      this.t += dt; this.stateTime += dt;
      this.flash = Math.max(0, this.flash - dt * 4);
      this.shake = Math.max(0, this.shake - dt);
      this.scorePop = Math.max(0, this.scorePop - dt * 6);
      this.bird.squash = Math.max(0, this.bird.squash - dt * 7);
      for (const b of this.buttons) if (b.pressed) b.pressed = Math.max(0, b.pressed - dt);

      if (this.curtain) {
        this.curtain.t += dt;
        if (!this.curtain.swapped && this.curtain.t >= 0.18) { this.curtain.swapped = true; this.reset(); }
        if (this.curtain.t >= 0.4) this.curtain = null;
      }

      const s = this.state;
      if (s === "paused") {
        if (this.resumeIn > 0) {
          this.resumeIn -= dt;
          if (this.resumeIn <= 0) { this.resumeIn = 0; this.state = "playing"; }
        }
        return;   // мир заморожен
      }
      this.sky.t = Math.min(1, this.sky.t + dt / 1.6);
      this.region.t = Math.min(1, this.region.t + dt / 1.2);
      if (this.banner) { this.banner.t += dt; if (this.banner.t > 2.6) this.banner = null; }
      this.updateParticles(dt);

      const dx = CFG.speed * u * dt;
      if (s === "ready" || s === "playing") {
        this.scroll.ground = (this.scroll.ground + dx) % tileW;
        this.scroll.hills = (this.scroll.hills + dx * 0.35) % tileW;
        this.scroll.clouds = (this.scroll.clouds + dx * 0.15) % tileW;
        this.scroll.far = (this.scroll.far + dx * 0.07) % tileW;
      }
      const bird = this.bird, r = CFG.hitRadius * u;

      if (s === "ready") {
        bird.y = this.birdStartY + Math.sin(this.t * 4) * 9 * u;
        bird.rot = 0;
        return;
      }
      if (s === "playing" || s === "dying") {
        bird.vy = Math.min(bird.vy + CFG.gravity * u * dt, CFG.maxFall * u);
        bird.y += bird.vy * dt;
        if (bird.y < r) { bird.y = r; bird.vy = Math.max(bird.vy, 0); }
        const target = Math.max(-0.4, Math.min(1.4, bird.vy / (CFG.flap * u) * 0.8));
        const k = Math.min(1, dt * (target > bird.rot ? 6 : 14));
        bird.rot += (target - bird.rot) * k;
      }
      if (s === "dying") {
        if (bird.y + r >= groundY) { bird.y = groundY - r; this.finish(); }
        return;
      }
      if (s === "playing") {
        this.playT += dt;
        for (const p of this.pipes) {
          p.x -= dx;
          if (p.move) p.gapY = p.baseY + Math.sin(p.move.ph + this.playT * p.move.w) * p.move.amp;
        }
        this.pipes = this.pipes.filter(p => p.x > -tex.pipe.w);
        this.nextPipe -= dx;
        if (this.nextPipe <= 0) { this.spawnPipe(); this.nextPipe += CFG.pipeSpacing * u; }
        for (const p of this.pipes) {
          if (!p.passed && p.x < this.birdX) { p.passed = true; this.onPoint(); }
        }
        this.collide();
      }
      if (s === "over" && this.over) {
        const t = this.stateTime - 0.65;
        this.over.shownScore = Math.round(this.score * Math.min(1, Math.max(0, t / 0.5)));
        if (this.over.isNew && !this.confetti && t > 1.1) {
          this.confetti = true;
          const colors = ["#FFD23F", "#E63946", "#6CC64A", "#2F9BEF", "#FF6BD6", "#FFFFFF"];
          this.burst(W * 0.5, safeTop + 10 * u, 70, { colors, vx: [-170, 170], vy: [-60, 160], size: [6, 10], life: [1.8, 2.8], g: 260, ui: true });
        }
      }
    }

    onPoint() {
      this.score++; this.scorePop = 1; Audio.play("point");
      this.burst(this.birdX + 6 * u, this.bird.y, 7, { colors: ["#FFD23F", "#FFFFFF"], speed: [60, 170], size: [3, 6], life: [0.3, 0.55], g: 200 });
      const theme = Math.floor(this.score / CFG.themeEvery) % SKIES.length;
      if (theme !== this.sky.to) this.sky = { from: this.sky.to, to: theme, t: 0 };
      // первые очки — Зелёная долина, дальше каждые 10 труб случайный город
      if (this.score >= CFG.regionFrom && (this.score - CFG.regionFrom) % CFG.regionEvery === 0) {
        const region = this.regionAt(this.score);
        this.region = { from: this.region.to, to: region, t: 0 };
        this.banner = { text: REGIONS[region].name, t: 0 };
        Music.setTheme(region);
      }
    }

    // случайный город без повторов, пока не покажем все
    nextRegion(prev) {
      if (!this.regionBag.length) {
        const bag = REGIONS.map((_, i) => i).slice(1).filter(i => this.sched.length || i !== prev); // стартовый город — не раньше следующего круга
        for (let i = bag.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [bag[i], bag[j]] = [bag[j], bag[i]]; }
        if (bag[0] === prev) bag.push(bag.shift());
        this.regionBag = bag;
      }
      return this.regionBag.shift();
    }

    // город для трубы/очка с номером sc: расписание смены городов строится заранее
    regionAt(sc) {
      if (sc < CFG.regionFrom) return this.startRegion;
      const k = Math.floor((sc - CFG.regionFrom) / CFG.regionEvery);
      while (this.sched.length <= k) this.sched.push(this.nextRegion(this.sched.length ? this.sched[this.sched.length - 1] : this.startRegion));
      return this.sched[k];
    }
    // отделка колонны: свой стиль у каждого города; в Санторини белая и синяя по очереди
    pipeSkin(sc) {
      const s = PIPE_SKIN[this.regionAt(sc)];
      if (s !== "santorini") return s;
      return ((sc - CFG.regionFrom) % CFG.regionEvery) % 2 ? "blue" : "white";
    }

    // масштаб персонажа: взмах крыльев и «сплющивание» — общий для отрисовки и столкновений
    birdScale() {
      const b = this.bird, flutter = (this.state === "ready" || this.state === "playing") ? 1 - 0.035 * (1 + Math.sin(this.t * 28)) : 1;
      return [1 + 0.08 * b.squash, flutter * (1 - 0.14 * b.squash)];
    }
    // контур непрозрачной части спрайта (в долях высоты): столкновение по тому, что видно на экране
    birdMask() {
      if (this.mask) return this.mask;
      const pts = [], im = this.vanik;
      try {
        if (!im) throw 0;
        const mh = 96, mw = Math.round(mh * im.width / im.height), c = document.createElement("canvas");
        c.width = mw; c.height = mh;
        const g = c.getContext("2d"); g.drawImage(im, 0, 0, mw, mh);
        const d = g.getImageData(0, 0, mw, mh).data, A = (x, y) => x >= 0 && y >= 0 && x < mw && y < mh && d[(y * mw + x) * 4 + 3] > 140;
        for (let y = 0; y < mh; y++) for (let x = 0; x < mw; x++)
          if (A(x, y) && (!A(x - 1, y) || !A(x + 1, y) || !A(x, y - 1) || !A(x, y + 1))) pts.push([(x + 0.5 - mw / 2) / mh, (y + 0.5) / mh - 0.5]);
        if (pts.length < 8) throw 0;
      } catch (e) {
        pts.length = 0;
        for (let a = 0; a < 48; a++) pts.push([Math.cos(a / 48 * 2 * Math.PI) * 0.5, Math.sin(a / 48 * 2 * Math.PI) * 0.5]);
      }
      return (this.mask = pts);
    }
    // точки контура в координатах экрана — с тем же поворотом и масштабом, что в drawBird
    birdPoints() {
      const h = CFG.birdHeight * u, [sx, sy] = this.birdScale(), r = this.bird.rot, cs = Math.cos(r), sn = Math.sin(r);
      const cx = this.birdX, cy = this.bird.y;
      return this.birdMask().map(([px, py]) => { const x = px * h * sx, y = py * h * sy; return [cx + x * cs - y * sn, cy + x * sn + y * cs]; });
    }

    collide() {
      const pts = this.birdPoints();
      let maxY = -Infinity, minX = Infinity, maxX = -Infinity;
      for (const [x, y] of pts) { if (y > maxY) maxY = y; if (x < minX) minX = x; if (x > maxX) maxX = x; }
      if (maxY >= groundY) { this.bird.y -= maxY - groundY; this.crash(true); return; }
      const half = tex.pipeBody / 2, b = block, capH = tex.pipeCapH;
      for (const p of this.pipes) {
        if (p.x + half + b < minX || p.x - half - b > maxX) continue;
        const top = p.gapY - p.gap / 2, bottom = p.gapY + p.gap / 2;
        for (const [x, y] of pts) {
          const dx = Math.abs(x - p.x);
          if (dx > half + b) continue;
          if (y < top && (dx <= half || y >= top - capH)) { this.crash(false); return; }
          if (y > bottom && (dx <= half || y <= bottom + capH)) { this.crash(false); return; }
        }
      }
    }

    // ---------- Отрисовка ----------
    drawTiles(c, offset, y, g = ctx) {
      const x = -Math.floor(offset);
      g.drawImage(c, x, y, c.w, c.h);
      if (x + c.w < W) g.drawImage(c, x + tileW, y, c.w, c.h);
    }

    // слои региона (дальний план, облака, ближний план) с оттенком времени суток
    drawRegion(idx, alpha, tint) {
      if (alpha <= 0) return;
      const rt = tex.regions[idx];
      ctx.globalAlpha = alpha;
      if (rt.far) this.drawTiles(tinted(rt.far, tint), this.scroll.far, groundY - rt.far.h);
      if (REGIONS[idx].clouds) this.drawTiles(tinted(tex.clouds, tint), this.scroll.clouds, groundY - tex.clouds.h);
      this.drawTiles(tinted(rt.near, tint), this.scroll.hills, groundY - rt.near.h + block);
      ctx.globalAlpha = 1;
    }

    draw() {
      ctx.save();
      if (this.shake > 0) {
        const m = 7 * u * (this.shake / 0.22);
        ctx.translate((Math.random() * 2 - 1) * m, (Math.random() * 2 - 1) * m);
      }
      // небо: во время смены времени суток — плавный переход, иначе один рисунок
      const sk = this.sky, st = easeOut(sk.t), skyFading = sk.to !== sk.from && sk.t < 1;
      ctx.drawImage(tex.skies[skyFading ? sk.from : sk.to], 0, 0, W, H);
      if (skyFading && st > 0) { ctx.globalAlpha = st; ctx.drawImage(tex.skies[sk.to], 0, 0, W, H); ctx.globalAlpha = 1; }

      // регион: обычно 2–3 готовые картинки; при смене региона/времени суток — плавное наложение
      const rg = this.region, rt = easeOut(rg.t), regFading = rg.to !== rg.from && rg.t < 1;
      const regs = regFading ? [[rg.from, 1 - rt], [rg.to, rt]] : [[rg.to, 1]];
      const tintA = SKIES[skyFading ? sk.from : sk.to].tint;
      for (const [r, a] of regs) this.drawRegion(r, a, tintA);
      if (skyFading && st > 0) for (const [r, a] of regs) this.drawRegion(r, a * st, SKIES[sk.to].tint);

      // трубы: рисуем только видимую часть текстуры
      const pw = tex.pipe.w, sc = tex.pipe.width / pw;
      for (const p of this.pipes) {
        if (p.x + pw / 2 < 0 || p.x - pw / 2 > W) continue;
      const pt = (tex.pipes && tex.pipes[p.skin]) || tex.pipe;
        const bottom = p.gapY + p.gap / 2, top = p.gapY - p.gap / 2;
        const hb = Math.min(H, groundY + block - bottom), ht = Math.min(H, top + 2);
        if (hb > 0) ctx.drawImage(pt, 0, 0, pt.width, hb * sc, p.x - pw / 2, bottom, pw, hb);
        if (ht > 0) {
          ctx.save();
          ctx.translate(p.x, top);
          ctx.scale(1, -1);
          ctx.drawImage(pt, 0, 0, pt.width, ht * sc, -pw / 2, 0, pw, ht);
          ctx.restore();
        }
      }
      this.drawTiles(tex.ground, this.scroll.ground, groundY);
      this.drawParticles(false);
      this.drawBird();
      ctx.restore();

      this.drawUI();
      this.drawParticles(true);

      if (this.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${this.flash * 0.9})`; ctx.fillRect(0, 0, W, H); }
      if (this.curtain) {
        const t = this.curtain.t, a = t < 0.18 ? t / 0.18 : 1 - (t - 0.18) / 0.22;
        ctx.fillStyle = `rgba(0,0,0,${Math.max(0, a)})`; ctx.fillRect(0, 0, W, H);
      }
    }

    drawBird() {
      const h = CFG.birdHeight * u, w = h * (this.vanik ? this.vanik.width / this.vanik.height : 1);
      const b = this.bird;
      const [sx, sy] = this.birdScale();
      ctx.save();
      ctx.translate(this.birdX, b.y);
      ctx.rotate(b.rot);
      ctx.scale(sx, sy);
      ctx.imageSmoothingEnabled = true;
      if (this.vanik) ctx.drawImage(this.vanik, -w / 2, -h / 2, w, h);
      else { ctx.fillStyle = "#FFD23F"; ctx.beginPath(); ctx.arc(0, 0, h / 2, 0, 7); ctx.fill(); }
      ctx.restore();
    }

    drawMute() {
      const s = 34 * u, x = W - s - 12 * u, y = safeTop + 12 * u;
      this.muteRect = { x: x - 8 * u, y: y - 8 * u, w: s + 16 * u, h: s + 16 * u };
      roundRect(x, y, s, s, 8 * u, "rgba(20,33,61,0.35)");
      ctx.save();
      ctx.translate(x + s / 2, y + s / 2);
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      const k = s / 34;
      ctx.moveTo(-10 * k, -5 * k); ctx.lineTo(-4 * k, -5 * k); ctx.lineTo(3 * k, -11 * k);
      ctx.lineTo(3 * k, 11 * k); ctx.lineTo(-4 * k, 5 * k); ctx.lineTo(-10 * k, 5 * k); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2.5 * k; ctx.lineCap = "round";
      const lvl = Audio.level;   // волны по уровню громкости, крестик — если всё на нуле
      if (lvl <= 0) {
        ctx.beginPath(); ctx.moveTo(7 * k, -6 * k); ctx.lineTo(14 * k, 6 * k); ctx.moveTo(14 * k, -6 * k); ctx.lineTo(7 * k, 6 * k); ctx.stroke();
      } else {
        ctx.beginPath(); ctx.arc(4 * k, 0, 6 * k, -0.9, 0.9); ctx.stroke();
        if (lvl > 0.5) { ctx.beginPath(); ctx.arc(4 * k, 0, 11 * k, -0.9, 0.9); ctx.stroke(); }
      }
      ctx.restore();
    }

    drawBanner() {
      const b = this.banner;
      if (!b) return;
      const a = b.t < 0.25 ? b.t / 0.25 : b.t > 2.1 ? Math.max(0, 1 - (b.t - 2.1) / 0.5) : 1;
      const sc = 0.7 + 0.3 * easeBack(b.t / 0.35), y = safeTop + 125 * u;
      ctx.save(); ctx.translate(W / 2, y); ctx.scale(sc, sc);
      text("ДОБРО ПОЖАЛОВАТЬ", 0, -24 * u, 12 * u, "#fff", { alpha: a });
      text(b.text, 0, 6 * u, 30 * u, "#FFD23F", { alpha: a });
      ctx.restore();
    }

    // кнопка-кубок слева сверху (открывает таблицу рекордов)
    drawTrophy() {
      const s = 34 * u, x = 12 * u, y = safeTop + 12 * u;
      this.lbRect = { x: x - 8 * u, y: y - 8 * u, w: s + 16 * u, h: s + 16 * u };
      roundRect(x, y, s, s, 8 * u, "rgba(20,33,61,0.35)");
      const k = s / 34;
      ctx.save();
      ctx.translate(x + s / 2, y + s / 2);
      ctx.fillStyle = "#FFD23F"; ctx.strokeStyle = "#FFD23F"; ctx.lineWidth = 2.5 * k;
      ctx.beginPath();                       // чаша
      ctx.moveTo(-8 * k, -10 * k); ctx.lineTo(8 * k, -10 * k); ctx.lineTo(7 * k, -1 * k);
      ctx.quadraticCurveTo(0, 6 * k, -7 * k, -1 * k); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.arc(-9 * k, -5 * k, 4 * k, Math.PI * 0.5, Math.PI * 1.5); ctx.stroke();   // ручки
      ctx.beginPath(); ctx.arc(9 * k, -5 * k, 4 * k, -Math.PI * 0.5, Math.PI * 0.5); ctx.stroke();
      ctx.fillRect(-2 * k, 2 * k, 4 * k, 5 * k);   // ножка
      ctx.fillRect(-7 * k, 7 * k, 14 * k, 4 * k);  // подставка
      ctx.restore();
    }
    drawPauseButton() {
      const s = 34 * u, x = 12 * u, y = safeTop + 12 * u;
      this.pauseRect = { x: x - 8 * u, y: y - 8 * u, w: s + 16 * u, h: s + 16 * u };
      roundRect(x, y, s, s, 8 * u, "rgba(20,33,61,0.35)");
      ctx.fillStyle = "#fff";
      ctx.fillRect(x + s * 0.3, y + s * 0.26, s * 0.14, s * 0.48);
      ctx.fillRect(x + s * 0.56, y + s * 0.26, s * 0.14, s * 0.48);
    }

    drawUI() {
      const s = this.state;
      if (s === "ready") {
        const a = Math.min(1, this.stateTime / 0.3);
        ctx.save(); ctx.globalAlpha = a;
        if (this.title) {
          const tw = Math.min(W * 0.86, 330 * u), th = tw * this.title.height / this.title.width;
          ctx.imageSmoothingEnabled = true;
          ctx.drawImage(this.title, (W - tw) / 2, safeTop + 40 * u + Math.sin(this.t * 3.5) * 6 * u, tw, th);
        }
        const pulse = 1 + 0.06 * Math.sin(this.t * 6);
        if (FINE_POINTER) {
          // пиксельная клавиша «пробел», которая сама себя нажимает
          const press = Math.max(0, Math.sin(this.t * 5)) ** 3, kw = 120 * u, kh = 30 * u, kx = W / 2 - kw / 2, ky = groundY - 135 * u + press * 5 * u;
          if (press < 0.9) roundRect(kx, ky + 7 * u - press * 5 * u, kw, kh, 7 * u, OUTLINE);
          roundRect(kx, ky, kw, kh, 7 * u, "#FFFFFF", OUTLINE, 3.5 * u);
          roundRect(kx + 8 * u, ky + 6 * u, kw - 16 * u, 5 * u, 2.5 * u, "#D9E8F5");
        } else {
          ctx.font = `${40 * u}px system-ui`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
          ctx.fillText("👆", W / 2, groundY - 120 * u + Math.sin(this.t * 9) * 6 * u);
        }
        ctx.save(); ctx.translate(W / 2, groundY - 70 * u); ctx.scale(pulse, pulse);
        text(FINE_POINTER ? "ЖМИ ПРОБЕЛ ИЛИ КЛИК" : "ТАПНИ, ЧТОБЫ ЛЕТЕТЬ!", 0, 0, 22 * u, "#FFD23F");
        ctx.restore();
        if (this.best > 0) text(`РЕКОРД: ${this.best}`, W / 2, groundY - 34 * u, 20 * u);
        text(`v${VERSION}`, W - 10 * u, H - safeBottom - 12 * u, 10 * u, "#fff", { align: "right", alpha: 0.75, stroke: 2 * u });
        ctx.restore();
        this.drawMute();
        this.drawTrophy();
      } else if (s === "playing" || s === "dying" || s === "paused") {
        const pop = 1 + 0.25 * Math.sin(this.scorePop * Math.PI);
        ctx.save();
        ctx.translate(W / 2, safeTop + 60 * u);
        ctx.scale(pop, pop);
        text(String(this.score), 0, 0, 56 * u, "#fff", { alpha: s === "dying" ? Math.max(0, 1 - this.stateTime * 4) : 1 });
        ctx.restore();
        if (s !== "paused") this.drawBanner();
        if (s === "playing") this.drawPauseButton();
        if (s === "paused") { this.drawPaused(); this.drawMute(); }
      } else if (s === "over") {
        this.drawGameOver();
        this.drawMute();
        this.drawTrophy();
      }
    }

    drawPaused() {
      ctx.fillStyle = "rgba(20,33,61,0.45)";
      ctx.fillRect(0, 0, W, H);
      const cy = groundY * 0.45 + safeTop * 0.5;
      if (this.resumeIn > 0) {
        const n = Math.ceil(this.resumeIn / 0.5), f = (this.resumeIn % 0.5) / 0.5;
        ctx.save(); ctx.translate(W / 2, cy); const sc = 1 + 0.35 * f; ctx.scale(sc, sc);
        text(String(n), 0, 0, 90 * u, "#FFD23F", { alpha: Math.min(1, 0.4 + f) });
        ctx.restore();
      } else {
        text("ПАУЗА", W / 2, cy - 20 * u, 44 * u, "#FFD23F");
        const pulse = 1 + 0.05 * Math.sin(this.t * 6);
        ctx.save(); ctx.translate(W / 2, cy + 40 * u); ctx.scale(pulse, pulse);
        text(FINE_POINTER ? "ПРОБЕЛ — ПРОДОЛЖИТЬ" : "ТАПНИ, ЧТОБЫ ПРОДОЛЖИТЬ", 0, 0, 17 * u, "#fff");
        ctx.restore();
      }
    }

    drawGameOver() {
      const t = this.stateTime, o = this.over;
      const centerY = groundY * 0.5 + safeTop * 0.5;

      // заголовок
      const ta = Math.min(1, Math.max(0, (t - 0.45) / 0.25));
      text("ИГРА ОКОНЧЕНА", W / 2, centerY - 150 * u - 30 * u * (1 - easeOut(ta)), 32 * u, "#FFB627", { alpha: ta });

      // панель
      const pw = Math.min(W * 0.86, 310 * u), ph = 170 * u;
      const pt = easeOut((t - 0.75) / 0.35);
      const py = H + ph - (H + ph - (centerY - 30 * u)) * pt;  // центр панели
      const px = W / 2;
      if (pt > 0) {
        roundRect(px - pw / 2, py - ph / 2, pw, ph, 14 * u, "#FFF1C1", OUTLINE, 5 * u);
        roundRect(px - pw / 2 + 11 * u, py - ph / 2 + 11 * u, pw - 22 * u, ph - 22 * u, 9 * u, null, "#E3C774", 3 * u);

        // медаль
        const mx = px - pw / 2 + 70 * u, my = py + 12 * u;
        text("МЕДАЛЬ", mx, py - 50 * u, 15 * u, "#F07E2A", { outline: "#fff", stroke: 2.5 * u });
        const ms = o.medal ? easeBack((t - 1.6) / 0.3) : 1;
        ctx.save();
        ctx.translate(mx, my);
        ctx.rotate(o.medal ? Math.sin(this.t * 2.6) * 0.08 : 0);
        ctx.scale(ms, ms);
        ctx.beginPath(); ctx.arc(0, 0, 34 * u, 0, Math.PI * 2);
        ctx.fillStyle = o.medal ? o.medal.color : "#E8D9A0"; ctx.fill();
        ctx.lineWidth = 4 * u; ctx.strokeStyle = OUTLINE; ctx.stroke();
        if (o.medal) {
          ctx.beginPath(); ctx.arc(0, 0, 25 * u, 0, Math.PI * 2);
          ctx.lineWidth = 3 * u; ctx.strokeStyle = "rgba(255,255,255,0.6)"; ctx.stroke();
          ctx.beginPath();
          for (let i = 0; i < 10; i++) {
            const rr = (i % 2 ? 0.45 : 1) * 17 * u, a = i * Math.PI / 5 - Math.PI / 2;
            const x = Math.cos(a) * rr, y = Math.sin(a) * rr;
            i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
          }
          ctx.closePath(); ctx.fillStyle = "#fff"; ctx.fill(); ctx.lineWidth = 2 * u; ctx.strokeStyle = OUTLINE; ctx.stroke();
        }
        ctx.restore();
        if (o.medal && ms > 0.5) text(o.medal.name, mx, my + 48 * u, 12 * u, "#fff", { stroke: 2 * u });

        // счёт и рекорд
        const rx = px + pw / 2 - 26 * u;
        text("СЧЁТ", rx, py - 50 * u, 15 * u, "#F07E2A", { align: "right", outline: "#fff", stroke: 2.5 * u });
        text(String(o.shownScore), rx, py - 20 * u, 32 * u, "#fff", { align: "right" });
        text("РЕКОРД", rx, py + 18 * u, 15 * u, "#F07E2A", { align: "right", outline: "#fff", stroke: 2.5 * u });
        text(String(this.best), rx, py + 48 * u, 32 * u, "#fff", { align: "right" });
        if (o.isNew && t > 1.75) {
          const sc = 1 + 0.08 * Math.sin(this.t * 10);
          ctx.save(); ctx.translate(rx - 108 * u, py + 48 * u); ctx.scale(sc, sc);
          roundRect(-27 * u, -11 * u, 54 * u, 22 * u, 5 * u, "#E63946", OUTLINE, 2.5 * u);
          ctx.font = `900 ${13 * u}px system-ui, sans-serif`; ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
          ctx.fillText("NEW", 0, 1 * u);
          ctx.restore();
        }
      }

      // кнопки
      const ba = Math.min(1, Math.max(0, (t - 1.2) / 0.2));
      const by = centerY - 30 * u + ph / 2 + 28 * u;
      const bw = Math.min((pw - 16 * u) / 2, 145 * u), bh = 54 * u;
      if (!this.buttons.length) {
        this.buttons = [
          { label: "ЗАНОВО", color: "#6CC64A", action: () => this.restart() },
          { label: "ПОДЕЛИТЬСЯ", color: "#FFB627", action: () => share(this.score) },
          { label: "ТОП ИГРОКОВ", color: "#4EA8DE", action: () => LBUI.open() },
        ];
      }
      this.buttons.forEach((b, i) => {
        if (i < 2) {
          b.w = bw; b.h = bh;
          b.x = i === 0 ? W / 2 - bw - 8 * u : W / 2 + 8 * u;
          b.y = by;
        } else {
          b.w = bw * 2 + 16 * u; b.h = 44 * u;
          b.x = W / 2 - b.w / 2; b.y = by + bh + 12 * u;
        }
        if (ba <= 0) return;
        const sc = b.pressed ? 0.92 : 1;
        ctx.save();
        ctx.globalAlpha = ba;
        ctx.translate(b.x + b.w / 2, b.y + b.h / 2); ctx.scale(sc, sc);
        roundRect(-b.w / 2, -b.h / 2, b.w, b.h, 10 * u, b.color, OUTLINE, 4 * u);
        roundRect(-b.w / 2 + 8 * u, -b.h / 2 + 7 * u, b.w - 16 * u, 6 * u, 3 * u, "rgba(255,255,255,0.45)");
        text(b.label, 0, 2 * u, (b.label.length > 7 ? 15 : 19) * u, "#fff", { stroke: 3 * u });
        ctx.restore();
      });
    }
  }

  async function share(score) {
    const url = location.href.split("#")[0];
    const msg = `Я набрал ${score} в Flappy Vanik! Сможешь больше?`;
    try {
      if (navigator.share) { await navigator.share({ title: "Flappy Vanik", text: msg, url }); return; }
      await navigator.clipboard.writeText(`${msg} ${url}`);
      toast("Ссылка скопирована!");
    } catch {}
  }
  let toastState = null;
  function toast(msg, dur = 2.5) { toastState = { msg, t: 0, dur }; }

  // ---------- Онлайн-таблица рекордов ----------
  const Leaderboard = {
    id: store.get("playerId", ""),
    name: store.get("playerName", ""),
    sent: parseInt(store.get("lbSent", "0"), 10) || 0,   // какой рекорд уже в таблице
    busy: null,
    init() {
      if (!/^[a-z0-9]{12}$/.test(this.id)) {
        this.id = Array.from({ length: 12 }, () => "abcdefghijklmnopqrstuvwxyz0123456789"[Math.floor(Math.random() * 36)]).join("");
        store.set("playerId", this.id);
      }
    },
    cleanName(s) { return String(s || "").replace(/[\u0000-\u001f\u007f<>]/g, "").replace(/\s+/g, " ").trim().slice(0, 12); },
    clean(list) {
      if (!Array.isArray(list)) return [];
      const seen = new Set(), out = [];
      for (const e of list) {
        if (!e || typeof e.id !== "string" || seen.has(e.id)) continue;
        const s = Math.floor(Number(e.s)), n = this.cleanName(e.n);
        if (!n || !(s > 0 && s < 100000)) continue;
        seen.add(e.id); out.push({ id: e.id.slice(0, 16), n, s, t: Number(e.t) || 0 });
      }
      return out.sort((a, b) => b.s - a.s || a.t - b.t);
    },
    async request(method, path, body) {
      const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), 9000);
      try {
        const res = await fetch(LB_DB + path, {
          method, cache: "no-store", signal: ctrl.signal,
          headers: body ? { "Content-Type": "application/json" } : {},
          body: body ? JSON.stringify(body) : undefined,
        });
        if (!res.ok) { const err = new Error("HTTP " + res.status); err.status = res.status; throw err; }
        return res.json();
      } finally { clearTimeout(timer); }
    },
    async load() {
      const d = await this.request("GET", '/scores.json?orderBy=%22s%22&limitToLast=100');
      return this.clean(Object.entries(d || {}).map(([id, e]) => ({ id, ...e })));
    },
    // Каждый игрок пишет только свою строку. Правила базы не дают понизить рекорд или удалить запись.
    async submit(score) {
      const path = `/scores/${this.id}.json`;
      try {
        await this.request("PUT", path, { n: this.name, s: score, t: Date.now() });
      } catch (e) {
        if (e.status !== 401 && e.status !== 403) throw e;
        // в таблице уже рекорд выше — просто обновляем имя
        const cur = await this.request("GET", path);
        if (!cur || !(cur.s >= score)) throw e;
        if (cur.n !== this.name) await this.request("PUT", path, { n: this.name, s: cur.s, t: Date.now() });
        score = cur.s;
      }
      this.markSent(score);
      return this.load();
    },
    markSent(s) { this.sent = Math.max(this.sent, s); store.set("lbSent", String(this.sent)); },
    submitBest(best) {
      if (!this.name || !(best > this.sent) || this.busy) return this.busy;
      this.busy = this.submit(best).catch(() => null).finally(() => { this.busy = null; });
      return this.busy;
    },
  };
  Leaderboard.init();

  const LBUI = {
    el: document.getElementById("lb"),
    list: document.getElementById("lb-list"),
    status: document.getElementById("lb-status"),
    form: document.getElementById("lb-form"),
    input: document.getElementById("lb-name"),
    save: document.getElementById("lb-save"),
    me: document.getElementById("lb-me"),
    get isOpen() { return !this.el.hidden; },
    init() {
      document.getElementById("lb-close").addEventListener("click", () => this.close());
      this.el.addEventListener("pointerdown", (e) => { if (e.target === this.el) this.close(); });
      this.form.addEventListener("submit", (e) => { e.preventDefault(); this.saveName(); });
    },
    open() {
      if (game) game.pause();
      this.el.hidden = false;
      this.input.value = Leaderboard.name;
      this.renderMe();
      this.refresh();
      if (!Leaderboard.name && FINE_POINTER) setTimeout(() => this.input.focus(), 50);
    },
    close() {
      this.el.hidden = true;
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    },
    renderMe() {
      const best = game ? game.best : 0;
      this.me.textContent = Leaderboard.name
        ? `ТВОЙ РЕКОРД: ${best}. В ТАБЛИЦЕ КАК «${Leaderboard.name}».`
        : best > 0 ? `ВВЕДИ ИМЯ, ЧТОБЫ ПОПАСТЬ В ТОП С РЕКОРДОМ ${best}.` : "СЫГРАЙ И ВВЕДИ ИМЯ, ЧТОБЫ ПОПАСТЬ В ТОП.";
      this.save.textContent = Leaderboard.name ? "ОК" : "В ТОП";
    },
    render(list) {
      this.list.textContent = "";
      const top = list.slice(0, 10);
      top.forEach((e, i) => this.list.appendChild(this.row(i + 1, e)));
      const myIdx = list.findIndex(e => e.id === Leaderboard.id);
      if (myIdx >= 10) this.list.appendChild(this.row(myIdx + 1, list[myIdx]));
      this.status.textContent = list.length ? "" : "ПОКА ПУСТО — СТАНЬ ПЕРВЫМ!";
    },
    row(rank, e) {
      const li = document.createElement("li");
      if (e.id === Leaderboard.id) li.className = "me";
      const medal = rank === 1 ? "🥇" : rank === 2 ? "🥈" : rank === 3 ? "🥉" : String(rank);
      for (const [cls, txt] of [["r", medal], ["n", e.n], ["s", String(e.s)]]) {
        const span = document.createElement("span"); span.className = cls; span.textContent = txt; li.appendChild(span);
      }
      return li;
    },
    async refresh() {
      this.status.textContent = "ЗАГРУЗКА…";
      try {
        if (Leaderboard.busy) await Leaderboard.busy;
        this.render(await Leaderboard.load());
      } catch {
        this.list.textContent = "";
        this.status.textContent = "НЕТ СВЯЗИ С ТАБЛИЦЕЙ. ПОПРОБУЙ ПОЗЖЕ.";
      }
    },
    async saveName() {
      const name = Leaderboard.cleanName(this.input.value);
      if (!name) { this.input.focus(); return; }
      Leaderboard.name = name; store.set("playerName", name);
      this.renderMe();
      const best = game ? game.best : 0;
      if (best <= 0) { this.status.textContent = "ИМЯ СОХРАНЕНО. ТЕПЕРЬ СЫГРАЙ!"; return; }
      this.save.disabled = true; this.status.textContent = "ОТПРАВЛЯЮ…";
      try { this.render(await Leaderboard.submit(best)); }
      catch { this.status.textContent = "НЕ ВЫШЛО ОТПРАВИТЬ. ПОПРОБУЙ ЕЩЁ РАЗ."; }
      finally { this.save.disabled = false; }
    },
  };
  LBUI.init();

  // ---------- Панель громкости ----------
  const VolUI = {
    el: document.getElementById("vol"),
    get isOpen() { return !this.el.hidden; },
    sync: {},
    init() {
      for (const kind of ["music", "sfx"]) {
        const input = document.getElementById("vol-" + kind), out = document.getElementById("vol-" + kind + "-v");
        this.sync[kind] = () => {
          const v = Math.round(Audio.vol[kind] * 100);
          input.value = v; out.textContent = v; input.style.setProperty("--p", v + "%");
        };
        input.addEventListener("input", () => {
          Audio.unlock();
          Audio.setVolume(kind, input.value / 100);
          this.sync[kind]();
          if (kind === "sfx") this.preview();
        });
      }
      document.getElementById("vol-close").addEventListener("click", () => this.close());
      this.el.addEventListener("pointerdown", (e) => { if (e.target === this.el) this.close(); });
    },
    preview() {   // короткий «дзынь», чтобы было слышно громкость эффектов
      const t = performance.now();
      if (t - (this.last || 0) > 160) { this.last = t; Audio.play("point"); }
    },
    open() {
      if (game) { game.pause(); game.resumeIn = 0; }
      this.sync.music(); this.sync.sfx();
      this.el.hidden = false;
    },
    close() {
      this.el.hidden = true;
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    },
  };
  VolUI.init();
  const modalOpen = () => LBUI.isOpen || VolUI.isOpen;

  // ---------- Ввод ----------
  function pointer(e) {
    e.preventDefault();
    if (!game || modalOpen()) return;
    const r = canvas.getBoundingClientRect();
    game.tap(e.clientX - r.left, e.clientY - r.top);
  }
  canvas.addEventListener("pointerdown", pointer, { passive: false });
  document.addEventListener("keydown", (e) => {
    if (modalOpen()) {   // не мешаем вводить имя и двигать ползунки
      if (e.code === "Escape") { LBUI.isOpen && LBUI.close(); VolUI.isOpen && VolUI.close(); }
      return;
    }
    if (e.repeat || !game) return;
    if (e.code === "Space" || e.code === "ArrowUp" || e.code === "Enter") { e.preventDefault(); game.key(); }
    else if (e.code === "KeyP" || e.code === "Escape") { e.preventDefault(); game.togglePause(); }
    else if (e.code === "KeyM") {   // M — быстро выключить/вернуть звук
      Audio.unlock();
      if (Audio.level > 0) { Audio.saved = { ...Audio.vol }; Audio.setVolume("music", 0); Audio.setVolume("sfx", 0); toast("ЗВУК ВЫКЛЮЧЕН"); }
      else { const s = Audio.saved || { music: 0.6, sfx: 0.85 }; Audio.setVolume("music", s.music); Audio.setVolume("sfx", s.sfx); toast("ЗВУК ВКЛЮЧЁН"); }
    }
  });
  ["touchstart", "touchmove", "gesturestart", "dblclick"].forEach(ev =>
    document.addEventListener(ev, (e) => { if (!modalOpen()) e.preventDefault(); }, { passive: false }));
  // автопауза, когда игру свернули или переключили вкладку/окно; звук на это время засыпает
  document.addEventListener("visibilitychange", () => {
    last = performance.now();
    if (document.hidden) { if (game) game.pause(); if (Audio.ctx) Audio.ctx.suspend(); }
    else if (Audio.ctx && Audio.unlocked) Audio.ctx.resume();
  });
  window.addEventListener("blur", () => { if (game) game.pause(); });

  // Если устройство не тянет 60 FPS (а экран может), понижаем чёткость холста
  const perf = { n: 0, sum: 0, minDt: 1 };
  function watchPerf(dt) {
    if (!game || game.state !== "playing" || document.hidden) { perf.n = perf.sum = 0; return; }
    perf.minDt = Math.min(perf.minDt, dt); perf.n++; perf.sum += dt;
    if (perf.n < 120) return;
    const avg = perf.sum / perf.n;
    perf.n = perf.sum = 0;
    if (avg > 0.021 && perf.minDt < 0.0185 && dpr > 1 && renderScale > 0.5) { renderScale = Math.max(0.5, renderScale * 0.75); resize(); }
  }

  // ---------- Цикл ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.1);
    last = now;
    if (game) {
      // физика шагами ≤ 1/60 с: при просадке кадров игра не уходит в «слоу-мо», а на 120 Гц идёт плавно
      const steps = Math.max(1, Math.ceil(dt * 60 - 0.25));
      for (let i = 0; i < steps; i++) game.update(dt / steps);
      game.draw();
      Music.setMood(game.state);
      watchPerf(dt);
      if (toastState) {
        const T = toastState;
        if (game.state !== "paused") T.t += dt;
        const a = T.t < 0.2 ? T.t / 0.2 : T.t > T.dur - 0.3 ? Math.max(0, 1 - (T.t - (T.dur - 0.3)) / 0.3) : 1;
        text(T.msg, W / 2, groundY + groundTop / 2, 15 * u, "#fff", { alpha: a });
        if (T.t > T.dur) toastState = null;
      }
    }
    requestAnimationFrame(frame);
  }

  async function boot() {
    resize();
    window.addEventListener("resize", resize);
    window.addEventListener("orientationchange", () => setTimeout(resize, 200));
    const fontP = (document.fonts && document.fonts.load)
      ? Promise.race([document.fonts.load(`16px "Press Start 2P"`), new Promise(r => setTimeout(r, 2500))])
          .then(() => { fontReady = document.fonts.check(`16px "Press Start 2P"`); })
          .catch(() => {})
      : Promise.resolve();
    const [vanik, title] = await Promise.all([img("vanik.png"), img("title.png"), fontP]);
    game = new Game({ vanik, title });
    if (location.hash === "#debug") { window.__game = game; window.__audio = { Audio, Music }; }
    document.getElementById("loading").remove();
    // «что нового» — один раз для тех, кто уже играл в прошлую версию
    if (store.get("seenVersion", "") !== VERSION) {
      if (game.best > 0) toast("НОВОЕ: ГОРОДА, МУЗЫКА, ГРОМКОСТЬ!", 4);
      store.set("seenVersion", VERSION);
    }
    requestAnimationFrame(frame);
  }
  boot();

  if ("serviceWorker" in navigator && location.protocol === "https:") {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(() => {}));
  }
})();
</script>
</body>
</html>
